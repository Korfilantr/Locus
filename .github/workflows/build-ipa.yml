# Builds an unsigned locbridge.ipa (this fork of Locus) for sideloading. SideStore or AltStore Classic
# signs it with your own Apple ID when you install it.
#
# Run it from the Actions tab ("Build IPA" -> "Run workflow"). Every run
# publishes the .ipa as a GitHub Release, so it can be downloaded straight to
# the phone.
name: Build IPA

on:
  workflow_dispatch:
    inputs:
      idevice:
        description: >-
          idevice library: "vendored" uses the prebuilt libidevice_ffi.a that
          Locus ships; "source" compiles it here from jkcoxson/idevice.
        type: choice
        options: [vendored, source]
        default: vendored
      idevice_ref:
        description: idevice commit or tag to compile when idevice is "source"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Compile idevice from source
        if: inputs.idevice == 'source'
        env:
          REF: ${{ inputs.idevice_ref }}
        run: |
          if [ -z "$REF" ]; then
            echo "::error::Set idevice_ref to the idevice commit to compile (see the Match idevice workflow)."
            exit 1
          fi
          git clone https://github.com/jkcoxson/idevice "$RUNNER_TEMP/idevice"
          cd "$RUNNER_TEMP/idevice"
          git checkout "$REF"
          rustup target add aarch64-apple-ios
          cd ffi
          # Same command idevice's own justfile uses for its iOS device build.
          BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$(xcrun --sdk iphoneos --show-sdk-path)" \
          IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            cargo build --release --target aarch64-apple-ios
          # Locus's Swift code is written against the vendored header, so a
          # different header means a different API: stop rather than guess.
          if ! diff -q <(tr -d '\r' < idevice.h) <(tr -d '\r' < "$GITHUB_WORKSPACE/Vendor/idevice/idevice.h"); then
            echo "::warning::Header from $REF differs from the vendored one; the app may not compile."
            diff <(tr -d '\r' < "$GITHUB_WORKSPACE/Vendor/idevice/idevice.h") <(tr -d '\r' < idevice.h) | head -80 || true
          fi
          cp "$RUNNER_TEMP/idevice/target/aarch64-apple-ios/release/libidevice_ffi.a" "$GITHUB_WORKSPACE/Vendor/idevice/"
          cp idevice.h "$GITHUB_WORKSPACE/Vendor/idevice/idevice.h"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Work out the version
        run: |
          # project.yml holds major.minor; the run number makes every build a
          # newer version, which is what SideStore looks for to offer an update.
          base=$(sed -nE 's/^ *MARKETING_VERSION: "([0-9.]+)".*/\1/p' project.yml | head -1)
          echo "VERSION=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild -project Locus.xcodeproj -target Locus \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          test -d build/Release-iphoneos/Locus.app

      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Locus.app Payload/
          zip -qry locbridge.ipa Payload
          ls -l locbridge.ipa
          shasum -a 256 locbridge.ipa | tee locbridge.ipa.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: locbridge-ipa
          path: |
            locbridge.ipa
            locbridge.ipa.sha256

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.idevice }} ${{ inputs.idevice_ref }}
        run: |
          tag="build-${BUILD}"
          gh release create "$tag" locbridge.ipa locbridge.ipa.sha256 \
            --title "locbridge ${VERSION}" \
            --notes "Built from ${GITHUB_SHA::7}. idevice: ${SOURCE:-vendored}. Unsigned; install with SideStore or AltStore Classic."
          echo "DOWNLOAD_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/locbridge.ipa" >> "$GITHUB_ENV"

      # The source lives on its own branch so these bot commits never touch main.
      # Add it in SideStore with:
      #   https://raw.githubusercontent.com/<owner>/<repo>/sidestore/source.json
      - name: Update the SideStore source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          src="$RUNNER_TEMP/source"
          if git ls-remote --exit-code --heads origin sidestore >/dev/null; then
            git fetch -q origin sidestore
            git worktree add -q "$src" origin/sidestore
            git -C "$src" checkout -q -B sidestore
          else
            git worktree add -q --orphan -b sidestore "$src"
          fi
          python3 .github/scripts/update_source.py locbridge.ipa "$src/source.json" \
            "$VERSION" "$BUILD" "$DOWNLOAD_URL" "$GITHUB_REPOSITORY"
          git -C "$src" add source.json
          git -C "$src" commit -q -m "locbridge ${VERSION}"
          git -C "$src" push -q origin sidestore
          echo "SideStore source: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/sidestore/source.json" >> "$GITHUB_STEP_SUMMARY"
