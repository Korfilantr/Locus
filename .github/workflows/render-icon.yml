# Renders AppIcon.icon with Apple's own Liquid Glass renderer (ictool, part of
# Icon Composer in Xcode 26) and commits the images to previews/ on this
# branch. It builds no app and publishes nothing.
name: Render icon

on:
  push:
    branches: [icon-lab]
    paths: ["AppIcon.icon/**", ".github/workflows/render-icon.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Find ictool
        run: |
          xcodebuild -version
          ictool=$(ls -d /Applications/Xcode*.app/Contents/Applications/Icon\ Composer.app/Contents/Executables/ictool 2>/dev/null | head -1)
          if [ -z "$ictool" ]; then
            echo "::error::ictool not found in any Xcode on this runner"
            ls /Applications | grep -i xcode
            exit 1
          fi
          echo "ICTOOL=$ictool" >> "$GITHUB_ENV"
          "$ictool" --version || true

      - name: Render every appearance
        run: |
          rm -rf previews && mkdir previews
          # Surface ictool's own usage text, so a changed CLI is easy to spot.
          "$ICTOOL" --help > help.txt 2>&1 || true
          echo "::notice title=ictool help::$(head -c 3000 help.txt | tr '\n' '|')"
          # Two CLI spellings exist across Icon Composer versions; try both.
          render() {  # rendition, appearance-name-for-export-preview
            local r=$1 a=$2 out="previews/$1.png"
            if "$ICTOOL" AppIcon.icon --export-image --output-file "$out" --platform iOS \
                 --rendition "$r" --width 1024 --height 1024 --scale 1 > err.txt 2>&1; then
              echo "rendered $r (export-image)"; return
            fi
            e1=$(tr '\n' ' ' < err.txt | head -c 400)
            if "$ICTOOL" AppIcon.icon --export-preview iOS "$a" 1024 1024 1 "$out" > err.txt 2>&1; then
              echo "rendered $r (export-preview)"; return
            fi
            e2=$(tr '\n' ' ' < err.txt | head -c 400)
            echo "::warning title=could not render $r::export-image: $e1 || export-preview: $e2"
          }
          render Default Light
          render Dark Dark
          render TintedLight TintedLight
          render TintedDark TintedDark
          render ClearLight ClearLight
          render ClearDark ClearDark
          ls -l previews

      - name: Contact sheet
        run: |
          ls previews/*.png >/dev/null 2>&1 || { echo "nothing rendered"; exit 0; }
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 tools/sheet.py previews/sheet.png $(ls previews/{Default,Dark,TintedLight,TintedDark}.png 2>/dev/null)

      - name: Commit the previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews
          git commit -q -m "Render previews for ${GITHUB_SHA::7}" || exit 0
          git push -q origin HEAD:icon-lab
