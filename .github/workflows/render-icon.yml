# Renders AppIcon.icon with Apple's own Liquid Glass renderer (ictool, part of
# Icon Composer in Xcode 26) and commits the images to previews/ on this
# branch. It builds no app and publishes nothing.
name: Render icon

on:
  push:
    branches: [icon-lab]
    paths: ["variants/**", ".github/workflows/render-icon.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Find ictool
        run: |
          xcodebuild -version
          ictool=$(ls -d /Applications/Xcode*.app/Contents/Applications/Icon\ Composer.app/Contents/Executables/ictool 2>/dev/null | head -1)
          if [ -z "$ictool" ]; then
            echo "::error::ictool not found in any Xcode on this runner"
            ls /Applications | grep -i xcode
            exit 1
          fi
          echo "ICTOOL=$ictool" >> "$GITHUB_ENV"
          "$ictool" --version || true

      - name: Render every appearance
        run: |
          rm -rf previews && mkdir previews
          # Surface ictool's own usage text, so a changed CLI is easy to spot.
          "$ICTOOL" --help > help.txt 2>&1 || true
          echo "::notice title=ictool help::$(head -c 3000 help.txt | tr '\n' '|')"
          # ictool usage: input --export-preview platform appearance width height scale out.png
          for icon in variants/*/AppIcon.icon; do
            v=$(basename "$(dirname "$icon")")
            mkdir -p "previews/$v"
            for a in Light Dark TintedLight TintedDark ClearLight ClearDark; do
              if ! "$ICTOOL" "$icon" --export-preview iOS "$a" 1024 1024 1 "previews/$v/$a.png" > err.txt 2>&1; then
                echo "::warning title=could not render $v $a::$(tr '\n' ' ' < err.txt | head -c 400)"
              fi
            done
          done
          find previews -name '*.png' | sort

      - name: Contact sheets
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          for d in previews/*/; do
            v=$(basename "$d")
            python3 tools/sheet.py "previews/$v-sheet.png" $(ls "$d"{Light,Dark,TintedDark,ClearDark}.png 2>/dev/null)
          done
          python3 tools/sheet.py previews/overview.png $(ls previews/*/Light.png) $(ls previews/*/Dark.png)

      - name: Commit the previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews
          git commit -q -m "Render previews for ${GITHUB_SHA::7}" || exit 0
          git push -q origin HEAD:icon-lab
